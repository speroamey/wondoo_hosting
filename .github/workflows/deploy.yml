name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, mysql, pdo_mysql, soap, curl
          coverage: none

      - name: Validate application
        run: |
          set -e
          find library modules themes -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          test ! -f config.php
          test -f library/FOSSBilling/Config.php || {
            echo "Required source file library/FOSSBilling/Config.php is missing from the checkout; ensure it is committed and not ignored." >&2
            exit 1
          }

      - name: Build release archive
        run: |
          mkdir -p dist
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='.DS_Store' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='config.php' \
            --exclude='config.old.php' \
            --exclude='data/cache' \
            --exclude='data/log' \
            --exclude='data/uploads' \
            --exclude='stats' \
            -czf dist/fossbilling.tar.gz .

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -e

          if [ -z "${SSH_KEY:-}" ]; then
            echo "DEPLOY_SSH_KEY is missing from the production GitHub Environment." >&2
            exit 1
          fi
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "DEPLOY_HOST is missing from the production GitHub Environment." >&2
            exit 1
          fi

          port="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY is not a valid private SSH key." >&2
            exit 1
          fi

          ssh-keyscan -T 15 -p "$port" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.log
          if ! grep -q . ~/.ssh/known_hosts; then
            cat /tmp/ssh-keyscan.log >&2
            echo "Could not retrieve the SSH host key from $DEPLOY_HOST:$port." >&2
            exit 1
          fi

      - name: Check deployment directory permissions
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          port="${DEPLOY_PORT:-22}"
          ssh -p "$port" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -e
          storage="$DEPLOY_PATH/../private/wondoo-deploy"
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "DEPLOY_PATH must be an absolute path." >&2; exit 1 ;;
          esac

          if [ ! -d "$DEPLOY_PATH" ]; then
            parent="$(dirname "$DEPLOY_PATH")"
            if [ ! -d "$parent" ] || [ ! -w "$parent" ]; then
              echo "Cannot create DEPLOY_PATH=$DEPLOY_PATH: parent $parent is not writable by $(id -un). Configure DEPLOY_PATH under the deploy user's home, or have the server administrator create and assign it to the deploy user." >&2
              exit 1
            fi
            mkdir -p "$DEPLOY_PATH"
          fi

          private_parent="$(dirname "$storage")"
          if [ ! -d "$private_parent" ] || [ ! -w "$private_parent" ]; then
            echo "ISPConfig private directory is missing or not writable: $private_parent (SSH user: $(id -un)). Ask the administrator to grant the website user access." >&2
            exit 1
          fi

          for path in "$DEPLOY_PATH" "$storage" "$storage/releases" "$storage/shared" "$storage/shared/config" "$private_parent/data"; do
            if [ -e "$path" ] && [ ! -w "$path" ]; then
              echo "Deployment path is not writable: $path (SSH user: $(id -un)). Have the server administrator assign this directory to the deploy user, or update DEPLOY_PATH to a writable location." >&2
              exit 1
            fi
          done

          mkdir -p "$storage/releases" "$storage/shared/config" "$private_parent/data"
          REMOTE

      - name: Ensure production config exists
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_CONFIG_PHP: ${{ secrets.DEPLOY_CONFIG_PHP }}
          DEPLOY_WEB_GROUP: ${{ secrets.DEPLOY_WEB_GROUP }}
        run: |
          set -e
          port="${DEPLOY_PORT:-22}"
          config_file="$RUNNER_TEMP/config.php"
          remote_tmp="/tmp/wondoo-config-${GITHUB_RUN_ID}.php"

          if [ -n "${DEPLOY_CONFIG_PHP:-}" ]; then
            printf '%s' "$DEPLOY_CONFIG_PHP" > "$config_file"
            chmod 600 "$config_file"
            php -l "$config_file"
            scp -P "$port" -i ~/.ssh/deploy_key "$config_file" "$DEPLOY_USER@$DEPLOY_HOST:$remote_tmp"
          fi

          ssh -p "$port" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' CONFIG_TMP='$remote_tmp' CONFIG_GROUP='${DEPLOY_WEB_GROUP:-www-data}' HAS_CONFIG_SECRET='${DEPLOY_CONFIG_PHP:+yes}' bash -s" <<'REMOTE'
          set -e
          storage="$DEPLOY_PATH/../private/wondoo-deploy"
          legacy_config="$DEPLOY_PATH/shared/config/config.php"
          config="$storage/shared/config/config.php"
          if [ ! -f "$config" ] && [ -f "$legacy_config" ]; then
            install -m 640 "$legacy_config" "$config"
            echo "Migrated the existing shared production config to ISPConfig private storage."
          fi
          if [ -f "$config" ]; then
            php -l "$config" >/dev/null || {
              echo "Existing production config.php is invalid PHP; refusing to replace it." >&2
              exit 1
            }

            if [ "${HAS_CONFIG_SECRET:-}" = yes ] && cmp -s "$CONFIG_TMP" "$config"; then
              # Repair a partial first-install file only when it exactly matches the
              # supplied secret; install inherits the setgid config directory group.
              install -m 640 "$CONFIG_TMP" "$config"
            else
              echo "Production config already exists and is valid; preserving it."
            fi
          else
            if [ "${HAS_CONFIG_SECRET:-}" != yes ]; then
              echo "Missing $config. Set DEPLOY_CONFIG_PHP in the production GitHub Environment." >&2
              exit 1
            fi
            install -m 640 "$CONFIG_TMP" "$config"
          fi

          if [ "$(stat -c '%G' "$config")" != "$CONFIG_GROUP" ]; then
            echo "Config group is '$(stat -c '%G' "$config")', expected '$CONFIG_GROUP'. Set the shared config directory's group and setgid bit; the deployment user cannot chown files." >&2
            exit 1
          fi

          rm -f "$CONFIG_TMP"
          php -l "$config"
          REMOTE
          rm -f "$config_file"

      - name: Deploy with release rotation and rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          set -e
          for required in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH; do
            if [ -z "${!required:-}" ]; then
              echo "$required is missing from the production GitHub Environment." >&2
              exit 1
            fi
          done
          port="${DEPLOY_PORT:-22}"
          archive_path="/tmp/.fossbilling-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          scp -P "$port" -i ~/.ssh/deploy_key dist/fossbilling.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$archive_path"
          ssh -p "$port" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' ARCHIVE_PATH='$archive_path' HEALTH_URL='$HEALTH_URL' GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -e
          archive="$ARCHIVE_PATH"
          trap 'rm -f "$archive"' EXIT
          storage="$DEPLOY_PATH/../private/wondoo-deploy"
          release="releases/$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA:-manual}"
          mkdir -p "$DEPLOY_PATH" "$storage/releases" "$storage/shared/config" "$DEPLOY_PATH/../private/data"
          mkdir -p "$storage/$release"
          tar -xzf "$archive" -C "$storage/$release"

          rm -rf "$storage/$release/data"
          ln -s "$DEPLOY_PATH/../private/data" "$storage/$release/data"

          if [ -f "$storage/shared/config/config.php" ]; then
            ln -s "$storage/shared/config/config.php" "$storage/$release/config.php"
          else
            echo "Missing $storage/shared/config/config.php" >&2
            exit 1
          fi

          previous_release=""
          if [ -L "$storage/current" ] && [ -e "$storage/current" ]; then
            previous_release="$(readlink -f "$storage/current")"
            ln -sfn "$previous_release" "$storage/previous"
          fi

          shared_data="$DEPLOY_PATH/../private/data"
          if [ -z "$(find "$shared_data" -mindepth 1 -print -quit)" ]; then
            for legacy_data in "$DEPLOY_PATH/shared/data" "$DEPLOY_PATH/data"; do
              if [ -d "$legacy_data" ] && [ ! -L "$legacy_data" ]; then
                cp -a "$legacy_data/." "$shared_data/"
              fi
            done
          fi

          # Keep ISPConfig's document root and its existing .htaccess untouched.
          # Store releases outside the public web root, then expose application
          # entries as symlinks through the stable current pointer.
          shopt -s dotglob nullglob
          for source in "$storage/$release"/*; do
            entry="${source##*/}"
            case "$entry" in
              .htaccess|config.php|data) continue ;;
            esac
            link_target="../private/wondoo-deploy/current/$entry"
            if [ "$(readlink "$DEPLOY_PATH/$entry" 2>/dev/null || true)" != "$link_target" ]; then
              rm -rf "$DEPLOY_PATH/$entry"
              ln -s "$link_target" "$DEPLOY_PATH/$entry"
            fi
          done
          if [ "$(readlink "$DEPLOY_PATH/config.php" 2>/dev/null || true)" != "../private/wondoo-deploy/shared/config/config.php" ]; then
            rm -rf "$DEPLOY_PATH/config.php"
            ln -s ../private/wondoo-deploy/shared/config/config.php "$DEPLOY_PATH/config.php"
          fi
          ln -sfn "$storage/$release" "$storage/current.next"
          mv -Tf "$storage/current.next" "$storage/current"

          php -l "$storage/$release/index.php"
          if [ -n "$HEALTH_URL" ]; then
            if ! curl --fail --silent --show-error --location --max-time 20 "$HEALTH_URL" >/dev/null; then
              if [ -n "$previous_release" ]; then
                ln -sfn "$previous_release" "$storage/current.next"
                mv -Tf "$storage/current.next" "$storage/current"
                echo "Health check failed; restored previous release $previous_release." >&2
              else
                echo "Health check failed on the first private-storage deployment; keeping the release active for diagnosis." >&2
              fi
              exit 1
            fi
          fi

          # Remove the old public release layout only after the new private
          # release passes its health check (or when no health URL is configured).
          rm -rf "$DEPLOY_PATH/current" "$DEPLOY_PATH/previous" "$DEPLOY_PATH/releases" "$DEPLOY_PATH/shared" "$DEPLOY_PATH/data"

          kept="$(find "$storage/releases" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 5)"
          find "$storage/releases" -mindepth 1 -maxdepth 1 -type d | sort | while read -r old; do
            if ! printf '%s\n' "$kept" | grep -Fxq "$old"; then rm -rf "$old"; fi
          done
          REMOTE