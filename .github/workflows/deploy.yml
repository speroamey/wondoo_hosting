name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, mysql, pdo_mysql, soap, curl
          coverage: none

      - name: Validate application
        run: |
          set -e
          find library modules themes -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          test ! -f config.php

      - name: Build release archive
        run: |
          mkdir -p dist
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='.DS_Store' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='config.php' \
            --exclude='config.old.php' \
            --exclude='data/cache' \
            --exclude='data/log' \
            --exclude='data/uploads' \
            --exclude='stats' \
            -czf dist/fossbilling.tar.gz .

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -e

          if [ -z "${SSH_KEY:-}" ]; then
            echo "DEPLOY_SSH_KEY is missing from the production GitHub Environment." >&2
            exit 1
          fi
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "DEPLOY_HOST is missing from the production GitHub Environment." >&2
            exit 1
          fi

          port="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY is not a valid private SSH key." >&2
            exit 1
          fi

          ssh-keyscan -T 15 -p "$port" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.log
          if ! grep -q . ~/.ssh/known_hosts; then
            cat /tmp/ssh-keyscan.log >&2
            echo "Could not retrieve the SSH host key from $DEPLOY_HOST:$port." >&2
            exit 1
          fi

      - name: Check deployment directory permissions
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          port="${DEPLOY_PORT:-22}"
          ssh -p "$port" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -e
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "DEPLOY_PATH must be an absolute path." >&2; exit 1 ;;
          esac

          if [ ! -d "$DEPLOY_PATH" ]; then
            parent="$(dirname "$DEPLOY_PATH")"
            if [ ! -d "$parent" ] || [ ! -w "$parent" ]; then
              echo "Cannot create DEPLOY_PATH=$DEPLOY_PATH: parent $parent is not writable by $(id -un). Configure DEPLOY_PATH under the deploy user's home, or have the server administrator create and assign it to the deploy user." >&2
              exit 1
            fi
            mkdir -p "$DEPLOY_PATH"
          fi

          for path in "$DEPLOY_PATH" "$DEPLOY_PATH/releases" "$DEPLOY_PATH/shared" "$DEPLOY_PATH/shared/data" "$DEPLOY_PATH/shared/config"; do
            if [ -e "$path" ] && [ ! -w "$path" ]; then
              echo "Deployment path is not writable: $path (SSH user: $(id -un)). Have the server administrator assign this directory to the deploy user, or update DEPLOY_PATH to a writable location." >&2
              exit 1
            fi
          done

          mkdir -p "$DEPLOY_PATH/releases" "$DEPLOY_PATH/shared/data" "$DEPLOY_PATH/shared/config"
          REMOTE

      - name: Ensure production config exists
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_CONFIG_PHP: ${{ secrets.DEPLOY_CONFIG_PHP }}
          DEPLOY_WEB_GROUP: ${{ secrets.DEPLOY_WEB_GROUP }}
        run: |
          set -e
          port="${DEPLOY_PORT:-22}"
          config_status="$(ssh -p "$port" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          if [ -f "$DEPLOY_PATH/shared/config/config.php" ]; then
            php -l "$DEPLOY_PATH/shared/config/config.php" >/dev/null || {
              echo "Existing production config.php is invalid PHP." >&2
              exit 1
            }
            printf 'CONFIG_PRESENT\n'
          else
            printf 'CONFIG_MISSING\n'
          fi
          REMOTE
          )"

          case "$config_status" in
            *CONFIG_PRESENT*)
              echo "Production config already exists and is valid; leaving it unchanged."
              exit 0
              ;;
            *CONFIG_MISSING*) ;;
            *)
              echo "Could not determine whether production config.php exists." >&2
              exit 1
              ;;
          esac

          if [ -z "${DEPLOY_CONFIG_PHP:-}" ]; then
            echo "Missing $DEPLOY_PATH/shared/config/config.php and DEPLOY_CONFIG_PHP is not configured in the production GitHub Environment." >&2
            exit 1
          fi

          config_file="$RUNNER_TEMP/config.php"
          printf '%s' "$DEPLOY_CONFIG_PHP" > "$config_file"
          chmod 600 "$config_file"
          php -l "$config_file"

          remote_tmp="/tmp/wondoo-config-${GITHUB_RUN_ID}.php"
          scp -P "$port" -i ~/.ssh/deploy_key "$config_file" "$DEPLOY_USER@$DEPLOY_HOST:$remote_tmp"
          ssh -p "$port" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' CONFIG_TMP='$remote_tmp' CONFIG_GROUP='${DEPLOY_WEB_GROUP:-www-data}' bash -s" <<'REMOTE'
          set -e
          config="$DEPLOY_PATH/shared/config/config.php"
          if [ ! -f "$config" ]; then
            install -m 640 -g "$CONFIG_GROUP" "$CONFIG_TMP" "$config"
          else
            echo "Production config appeared during deploy; preserving existing file."
          fi
          rm -f "$CONFIG_TMP"
          php -l "$config"
          REMOTE
          rm -f "$config_file"

      - name: Deploy with release rotation and rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          set -e
          for required in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH; do
            if [ -z "${!required:-}" ]; then
              echo "$required is missing from the production GitHub Environment." >&2
              exit 1
            fi
          done
          port="${DEPLOY_PORT:-22}"
          scp -P "$port" -i ~/.ssh/deploy_key dist/fossbilling.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/fossbilling.tar.gz"
          ssh -p "$port" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' HEALTH_URL='$HEALTH_URL' GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -e
          release="releases/$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA:-manual}"
          mkdir -p "$DEPLOY_PATH" "$DEPLOY_PATH/releases" "$DEPLOY_PATH/shared/data" "$DEPLOY_PATH/shared/config"
          mkdir -p "$DEPLOY_PATH/$release"
          tar -xzf /tmp/fossbilling.tar.gz -C "$DEPLOY_PATH/$release"

          rm -rf "$DEPLOY_PATH/$release/data"
          ln -s "$DEPLOY_PATH/shared/data" "$DEPLOY_PATH/$release/data"

          if [ -f "$DEPLOY_PATH/shared/config/config.php" ]; then
            ln -s "$DEPLOY_PATH/shared/config/config.php" "$DEPLOY_PATH/$release/config.php"
          else
            echo "Missing $DEPLOY_PATH/shared/config/config.php" >&2
            exit 1
          fi

          if [ -L "$DEPLOY_PATH/current" ] && [ -e "$DEPLOY_PATH/current" ]; then
            ln -sfn "$DEPLOY_PATH/current" "$DEPLOY_PATH/previous"
          fi

          ln -sfn "$DEPLOY_PATH/$release" "$DEPLOY_PATH/current.next"
          mv -Tf "$DEPLOY_PATH/current.next" "$DEPLOY_PATH/current"

          php -l "$DEPLOY_PATH/$release/index.php"
          if [ -n "$HEALTH_URL" ]; then
            if ! curl --fail --silent --show-error --location --max-time 20 "$HEALTH_URL" >/dev/null; then
              if [ -L "$DEPLOY_PATH/previous" ] && [ -e "$DEPLOY_PATH/previous" ]; then
                ln -sfn "$(readlink -f "$DEPLOY_PATH/previous")" "$DEPLOY_PATH/current.next"
                mv -Tf "$DEPLOY_PATH/current.next" "$DEPLOY_PATH/current"
              fi
              rm -f /tmp/fossbilling.tar.gz
              echo "Health check failed; deployment was rolled back" >&2
              exit 1
            fi
          fi
          rm -f /tmp/fossbilling.tar.gz

          kept="$(find "$DEPLOY_PATH/releases" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 5)"
          find "$DEPLOY_PATH/releases" -mindepth 1 -maxdepth 1 -type d | sort | while read -r old; do
            if ! printf '%s\n' "$kept" | grep -Fxq "$old"; then rm -rf "$old"; fi
          done
          REMOTE